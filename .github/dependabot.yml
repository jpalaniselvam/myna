# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# -https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.ymlfile

version: 2
updates:
  # 1. Maintain GitHub Actions (workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
       actions:
        patterns:
          - "*" 
  # 2. Maintain Go modules (root directory)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Group AWS SDK updates to avoid 50 distinct PRs for every service
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
      test-deps:
        patterns:
          - "github.com/stretchr/testify"
    # Ensure it respects your go.mod version constraints
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
  # 3. Maintain Documentation Dependencies (npm in /docs)
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      astro-ecosystem:
        patterns:
          - "astro"
          - "@astrojs/*"
