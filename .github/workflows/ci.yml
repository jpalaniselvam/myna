name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Go code is not formatted:"
          gofmt -d .
          exit 1
        fi

    - name: CLI Build
      run: go build -v ./cmd/myna

    - name: Frontend Build
      run: cd frontend && npm install && npm run build

    - name: Desktop Build
      run: echo "Skipping desktop build for now"

    - name: Test
      run: go test -v ./...
